<!--
  One tile of the repeating marsh pattern: short grass blades fanning up from a
  line, like the swamp symbol on topo maps. The tile is 32 CSS pixels drawn at
  twice the size, so the tufts stay crisp on high density screens. Tufts are
  offset so the repeat doesn't read as a grid, and kept away from the edges so
  none get cut off. marshPattern.ts swaps currentColor for the map's colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <path id="tuft" d="M-4 0H4 M-1 0L-3 -3 M-0.5 0L-1.5 -4.5 M0 0V-5.5 M0.5 0L1.5 -4.5 M1 0L3 -3"
      fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
  </defs>
  <use xlink:href="#tuft" x="9" y="12" />
  <use xlink:href="#tuft" x="25" y="28" />
</svg>
