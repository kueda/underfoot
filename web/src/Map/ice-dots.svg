<!--
  One tile of the repeating ice pattern: scattered dots, like the glaciers on
  the USGS geologic map of Alaska. The tile is 48 CSS pixels drawn at twice the
  size, so the dots stay crisp on high density screens. Dots are jittered off a
  grid so the repeat doesn't read as one, and kept away from the edges so none
  get cut off. pattern.ts swaps currentColor for the map's colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48">
  <g fill="currentColor">
    <circle cx="6" cy="9" r="1.4" />
    <circle cx="23" cy="5" r="1.4" />
    <circle cx="41" cy="10" r="1.4" />
    <circle cx="11" cy="25" r="1.4" />
    <circle cx="27" cy="21" r="1.4" />
    <circle cx="39" cy="29" r="1.4" />
    <circle cx="5" cy="40" r="1.4" />
    <circle cx="20" cy="43" r="1.4" />
    <circle cx="33" cy="39" r="1.4" />
  </g>
</svg>
