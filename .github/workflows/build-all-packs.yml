name: Build all packs

on:
  push:
    # Reprocess all packs if anything related to source processing changes. Keep in
    # sync with built_by_build_all_packs() in data/changed_packs.py
    paths:
      - data/sources/util/**
      - '!data/sources/util/__init__.py'
    branches: main
  workflow_dispatch:

permissions:
  actions: write      # skip-duplicate-actions cancels superseded runs
  contents: read
  packages: write     # build-image.yml pushes to GHCR

jobs:
  skip-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ github.token }}

  image:
    needs: skip-duplicates
    uses: ./.github/workflows/build-image.yml

  # Don't spend time and bandwidth building packs if the tests fail
  run-pytest:
    needs: image
    uses: ./.github/workflows/pytest.yml
    with:
      image: ${{ needs.image.outputs.image }}

  # https://code.dblock.org/2021/09/03/generating-task-matrix-by-looping-over-repo-files-with-github-actions.html
  list-packs:
    needs: skip-duplicates
    name: List packs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: echo "matrix=$(ls data/packs/*.json | xargs -I'{}' basename {} .json | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  build-packs:
    name: Build packs
    needs: [image, list-packs, run-pytest]
    strategy:
      fail-fast: false
      # Each pack runs several jobs at once, and too many at once get
      # rate limited by servers like Census that we download from
      max-parallel: 4
      matrix:
        pack: ${{ fromJson(needs.list-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
