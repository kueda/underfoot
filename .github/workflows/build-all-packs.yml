name: Build all packs

on:
  push:
    # Reprocess all packs if anything related to source processing changes, rebuilding
    # the layers it affects. Keep in sync with built_by_build_all_packs() in
    # data/changed_packs.py
    paths:
      - data/sources/util/**
      - '!data/sources/util/__init__.py'
    branches: main
  workflow_dispatch:

permissions:
  actions: write      # skip-duplicate-actions and list-packs read past runs
  contents: read
  packages: write     # build-image.yml pushes to GHCR

# A new run replaces any run in progress on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ github.token }}

  image:
    needs: skip-duplicates
    uses: ./.github/workflows/build-image.yml

  # Don't spend time and bandwidth building packs if the tests fail
  run-pytest:
    needs: image
    uses: ./.github/workflows/pytest.yml
    with:
      image: ${{ needs.image.outputs.image }}

  # https://code.dblock.org/2021/09/03/generating-task-matrix-by-looping-over-repo-files-with-github-actions.html
  list-packs:
    needs: skip-duplicates
    name: List packs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for the diff against the last successful run's commit
      # List every pack with the layers affected by the changes since the last
      # successful run, so a run picks up the changes of runs that were cancelled or
      # failed. List every layer when run by hand or when the diff fails, like when
      # no run has succeeded or a force push dropped that run's commit
      - id: set-matrix
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = push ] \
            && before=$(gh run list --workflow build-all-packs.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha') \
            && [ -n "$before" ] \
            && changed=$(git diff --name-only "$before" "$AFTER"); then
            matrix=$(python3 data/changed_packs.py --build-all-packs --before "$before" \
              <<< "$changed")
          else
            matrix=$(python3 data/changed_packs.py --build-all-packs --every-layer)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-packs:
    name: Build packs
    needs: [image, list-packs, run-pytest]
    strategy:
      fail-fast: false
      # Each pack runs several jobs at once, and too many at once get
      # rate limited by servers like Census that we download from
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.list-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      image: ${{ needs.image.outputs.image }}
      layers: ${{ toJSON(matrix.layers) }}
    secrets: inherit
