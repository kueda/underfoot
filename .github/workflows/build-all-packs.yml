name: Build all packs

on:
  push:
    # Reprocess all packs if anything related to source processing changes.
    # TODO come up with a better way to exclude data/sources/util/__init__.py
    paths:
      - data/sources/util/c*
      - data/sources/util/m*
      - data/sources/util/p*
      - data/sources/util/r*
      - data/sources/util/t*
      - data/sources/util/u*
      - data/sources/util/w*
    branches: main
  workflow_dispatch:

permissions:
  actions: write      # skip-duplicate-actions cancels superseded runs
  contents: read
  packages: write     # build-image.yml pushes to GHCR

jobs:
  skip-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ github.token }}

  image:
    needs: skip-duplicates
    uses: ./.github/workflows/build-image.yml

  # https://code.dblock.org/2021/09/03/generating-task-matrix-by-looping-over-repo-files-with-github-actions.html
  list-packs:
    needs: skip-duplicates
    name: List packs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: echo "matrix=$(ls data/packs/*.json | xargs -I'{}' basename {} .json | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  build-packs:
    name: Build packs
    needs: [image, list-packs]
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJson(needs.list-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
