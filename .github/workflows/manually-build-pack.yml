name: Manually build packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: |
          Space-separated list of pack IDs you want to build,
          e.g. "us-ca-oakland us-ca-la"
        required: true
        type: string

permissions:
  contents: read
  packages: write     # build-image.yml pushes to GHCR

jobs:
  image:
    uses: ./.github/workflows/build-image.yml

  list-packs:
    name: List packs
    runs-on: ubuntu-latest
    if:  ${{ inputs.packs }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Set the matrix output to a JSON array from a space-separated string
      # from the workflow_dispatch input
      - id: set-matrix
        run: |
          python -c "import sys, json; print('matrix='+json.dumps('${{ inputs.packs }}'.split()))" >> $GITHUB_OUTPUT

  build-packs:
    name: Build pack
    needs: [image, list-packs]
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJson(needs.list-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
