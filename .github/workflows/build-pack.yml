name: Build Pack

on:
  workflow_call:
    inputs:
      pack:
        description: A pack ID (e.g. 'us-ca-oakland')
        type: string
        required: true
      image:
        description: Prebuilt app image ref (from .github/workflows/build-image.yml)
        type: string
        required: true
      publish:
        description: |
          Publish the pack to Digital Ocean. If false, upload the pack zip as
          a workflow artifact instead.
        type: boolean
        default: true
    secrets:
      DO_SPACES_KEY:
        required: true
      DO_SPACES_SECRET:
        required: true
      DO_ACCESS_TOKEN:
        required: true

permissions:
  contents: read
  packages: read      # pull the app image from GHCR

defaults:
  run:
    working-directory: data

jobs:
  rocks:
    name: Build rocks
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      - name: Cache source work for rocks
        uses: actions/cache@v5
        with:
          path: data/sources/work-*
          key: cache-source-work-rocks-3-${{ inputs.pack }}-${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}

      - name: Build rocks
        run: python packs.py ${{ inputs.pack }} --only rocks

      - name: Upload rocks
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-rocks
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  water:
    name: Build water
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      # Restore and save separately so downloads from a failed build are
      # saved for the next attempt. Each run saves under its own key because
      # cache keys can't be overwritten, and restores the latest one for the
      # same pack definition, falling back to the latest one for the pack.
      # Slashes delimit the pack ID, so us-ca doesn't match us-ca-oakland.
      - name: Restore source work for water
        id: restore-water-cache
        uses: actions/cache/restore@v5
        with:
          path: data/sources/work-*
          key: cache-source-work-water-4-${{ inputs.pack }}/${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cache-source-work-water-4-${{ inputs.pack }}/${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}/
            cache-source-work-water-4-${{ inputs.pack }}/

      # Water reads the OSM extract for waterway names and gap fills, so share
      # the ways & context job's cache of it
      - name: Get current year week
        id: calc-year-week
        run: echo "year-week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Get OSM URL
        id: get-osm-url
        run: echo "osm-url=$(jq -c -r .osm packs/${{ inputs.pack }}.json)" >> $GITHUB_OUTPUT

      - name: Cache OSM download
        uses: actions/cache@v5
        with:
          path: "data/*.osm.pbf"
          key: cache-osm-${{ steps.get-osm-url.outputs.osm-url }}-${{ steps.calc-year-week.outputs.year-week }}

      # Packs with hydrography from OSM take the sea from osmdata's water
      # polygons, a 900 MB download that changes slowly
      - name: Get hydrography source
        id: get-hydrography
        run: echo "hydrography=$(jq -r '.hydrography // empty' packs/${{ inputs.pack }}.json)" >> $GITHUB_OUTPUT

      - name: Get current year month
        if: steps.get-hydrography.outputs.hydrography == 'osm'
        id: calc-year-month
        run: echo "year-month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Cache OSM water polygons download
        if: steps.get-hydrography.outputs.hydrography == 'osm'
        uses: actions/cache@v5
        with:
          path: data/water-polygons-split-4326.zip
          key: cache-osm-water-polygons-${{ steps.calc-year-month.outputs.year-month }}

      # Public repos' runners have 4 CPUs, and water sources are processed in parallel
      - name: Build water
        run: python packs.py ${{ inputs.pack }} --only water --procs 4

      - name: Save source work for water
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/sources/work-*
          key: ${{ steps.restore-water-cache.outputs.cache-primary-key }}

      - name: Upload water
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-water
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  contours:
    name: Build contours
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      # Elevation tiles aren't cached: they download from S3 in minutes, even
      # for the biggest packs, and caching them took gigabytes of the repo's
      # 10 GB cache limit away from slower sources

      # Public repos' runners have 4 CPUs, and making contours is CPU-bound
      - name: Build contours
        run: python packs.py ${{ inputs.pack }} --only contours --procs 4

      - name: Upload contours
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-contours
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  osm:
    name: Build ways & context
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      - name: Get current year week
        id: calc-year-week
        run: echo "year-week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Get OSM URL
        id: get-osm-url
        run: echo "osm-url=$(jq -c -r .osm packs/${{ inputs.pack }}.json)" >> $GITHUB_OUTPUT

      - name: Cache OSM download
        uses: actions/cache@v5
        with:
          path: "data/*.osm.pbf"
          key: cache-osm-${{ steps.get-osm-url.outputs.osm-url }}-${{ steps.calc-year-week.outputs.year-week }}

      - name: Build ways & context
        run: python packs.py ${{ inputs.pack }} --only ways context

      - name: Upload ways
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-ways
          path: "data/build/${{ inputs.pack }}.pmtiles/"

      - name: Upload context
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-context
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  metadata:
    name: Write pack.json
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Write pack.json
        run: python packs.py ${{ inputs.pack }} --only metadata

      - name: Upload pack.json
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-metadata
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  upload-pack:
    name: Archive and upload pack
    runs-on: ubuntu-24.04
    needs:
      - rocks
      - water
      - contours
      - osm
      - metadata
    steps:
      - uses: actions/checkout@v7

      - name: Download all PMTiles artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.pack }}-*
          path: data

      - name: Zip up the pack
        run: |
          mkdir -p build/${{ inputs.pack }}
          mv ${{ inputs.pack }}-rocks/* build/${{ inputs.pack }}/
          mv ${{ inputs.pack }}-contours/* build/${{ inputs.pack }}/
          mv ${{ inputs.pack }}-water/* build/${{ inputs.pack }}/
          mv ${{ inputs.pack }}-ways/* build/${{ inputs.pack }}/
          mv ${{ inputs.pack }}-context/* build/${{ inputs.pack }}/
          mv ${{ inputs.pack }}-metadata/* build/${{ inputs.pack }}/
          cd build/
          zip ${{ inputs.pack }}.pmtiles.zip ${{ inputs.pack }}/*
          cd ../

      - name: Upload pack zip as artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          path: data/build/${{ inputs.pack }}.pmtiles.zip
          # Upload the zip as-is so it doesn't get wrapped in another zip
          archive: false

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the manifest
        if: ${{ inputs.publish }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            --user "$(id -u):$(id -g)" -e HOME=/tmp ${{ inputs.image }} \
            python packs.py manifest \
              --s3-bucket-url https://static.underfoot.rocks \
              --manifest-url https://static.underfoot.rocks/manifest.json

      - name: Set up s3cmd for Digital Ocean
        if: ${{ inputs.publish }}
        uses: s3-actions/s3cmd@v1.2.0
        with:
          provider: digitalocean
          region: sfo2
          access_key: ${{ secrets.DO_SPACES_KEY }}
          secret_key: ${{ secrets.DO_SPACES_SECRET }}

      - name: Upload pack to Digital Ocean
        if: ${{ inputs.publish }}
        run: |
          s3cmd put build/manifest.json s3://underfoot2/manifest.json
          s3cmd setacl s3://underfoot2/manifest.json --acl-public
          s3cmd put build/${{ inputs.pack }}.pmtiles.zip s3://underfoot2/${{ inputs.pack }}.pmtiles.zip
          s3cmd setacl s3://underfoot2/${{ inputs.pack }}.pmtiles.zip --acl-public

      - name: Set up doctl
        if: ${{ inputs.publish }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Flush the CDN cache
        if: ${{ inputs.publish }}
        run: doctl compute cdn flush ee6a9baf-c5bd-423d-bbcf-305e3a3f5e40
