name: Build Pack

on:
  workflow_call:
    inputs:
      pack:
        description: A pack ID (e.g. 'us-ca-oakland')
        type: string
        required: true
      image:
        description: Prebuilt app image ref (from .github/workflows/build-image.yml)
        type: string
        required: true
      layers:
        description: |
          JSON array of the layers to build. Takes the other layers from the
          published pack, or builds every layer if it hasn't been published.
        type: string
        default: '["rocks", "water", "contours", "ways", "context"]'
      publish:
        description: |
          Publish the pack to Digital Ocean. If false, upload the pack zip as
          a workflow artifact instead.
        type: boolean
        default: true
    secrets:
      DO_SPACES_KEY:
        required: true
      DO_SPACES_SECRET:
        required: true
      DO_ACCESS_TOKEN:
        required: true

permissions:
  contents: read
  packages: read      # pull the app image from GHCR

defaults:
  run:
    working-directory: data

env:
  # The published pack, which the layers that aren't built are taken from
  PACK_URL: https://static.underfoot.rocks/${{ inputs.pack }}.pmtiles.zip

jobs:
  plan:
    name: Choose layers to build
    runs-on: ubuntu-24.04
    outputs:
      layers: ${{ steps.layers.outputs.layers }}
      reused: ${{ steps.layers.outputs.reused }}
    steps:
      - id: layers
        working-directory: .
        env:
          LAYERS: ${{ inputs.layers }}
          ALL_LAYERS: '["rocks", "water", "contours", "ways", "context"]'
        run: |
          reused=$(jq -n -c --argjson all "$ALL_LAYERS" --argjson layers "$LAYERS" \
            '$all - $layers')
          if [ "$reused" != "[]" ] && ! curl -sfI "$PACK_URL" > /dev/null; then
            echo "$PACK_URL isn't published, so building every layer"
            LAYERS=$ALL_LAYERS
            reused="[]"
          fi
          echo "layers=$(jq -c . <<< "$LAYERS")" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

  rocks:
    name: Build rocks
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.layers), 'rocks') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      - name: Cache source work for rocks
        uses: actions/cache@v5
        with:
          path: data/sources/work-*
          key: cache-source-work-rocks-4-${{ inputs.pack }}-${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}

      - name: Build rocks
        run: python packs.py ${{ inputs.pack }} --only rocks

      - name: Upload rocks
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-rocks
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  water:
    name: Build water
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.layers), 'water') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      # Restore and save separately so downloads from a failed build are
      # saved for the next attempt. Each run saves under its own key because
      # cache keys can't be overwritten, and restores the latest one for the
      # same pack definition, falling back to the latest one for the pack.
      # Slashes delimit the pack ID, so us-ca doesn't match us-ca-oakland.
      - name: Restore source work for water
        id: restore-water-cache
        uses: actions/cache/restore@v5
        with:
          path: data/sources/work-*
          key: cache-source-work-water-4-${{ inputs.pack }}/${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cache-source-work-water-4-${{ inputs.pack }}/${{ hashFiles(format('data/packs/{0}.json', inputs.pack)) }}/
            cache-source-work-water-4-${{ inputs.pack }}/

      # Water reads the OSM extract for waterway names and gap fills, so share
      # the ways & context job's cache of it
      - name: Get current year week
        id: calc-year-week
        run: echo "year-week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Get OSM URL
        id: get-osm-url
        run: echo "osm-url=$(jq -c -r .osm packs/${{ inputs.pack }}.json)" >> $GITHUB_OUTPUT

      - name: Cache OSM download
        uses: actions/cache@v5
        with:
          path: "data/*.osm.pbf"
          key: cache-osm-${{ steps.get-osm-url.outputs.osm-url }}-${{ steps.calc-year-week.outputs.year-week }}

      # Public repos' runners have 4 CPUs, and water sources are processed in parallel
      - name: Build water
        run: python packs.py ${{ inputs.pack }} --only water --procs 4

      - name: Save source work for water
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/sources/work-*
          key: ${{ steps.restore-water-cache.outputs.cache-primary-key }}

      - name: Upload water
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-water
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  contours:
    name: Build contours
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.layers), 'contours') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      # Elevation tiles aren't cached: they download from S3 in minutes, even
      # for the biggest packs, and caching them took gigabytes of the repo's
      # 10 GB cache limit away from slower sources

      # Public repos' runners have 4 CPUs, and making contours is CPU-bound
      - name: Build contours
        run: python packs.py ${{ inputs.pack }} --only contours --procs 4

      - name: Upload contours
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-contours
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  osm:
    name: Build ways & context
    needs: plan
    if: >-
      ${{ contains(fromJSON(needs.plan.outputs.layers), 'ways')
        || contains(fromJSON(needs.plan.outputs.layers), 'context') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: underfoot
          POSTGRES_PASSWORD: underfoot
          POSTGRES_DB: underfoot
        options: >-
          --health-cmd "pg_isready -U underfoot"
          --health-interval 10s --health-timeout 5s --health-retries 5
          --shm-size 1g
    env:
      PGHOST: postgres
      PGUSER: underfoot
      PGPASSWORD: underfoot
    steps:
      - uses: actions/checkout@v7

      - name: Get current year week
        id: calc-year-week
        run: echo "year-week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Get OSM URL
        id: get-osm-url
        run: echo "osm-url=$(jq -c -r .osm packs/${{ inputs.pack }}.json)" >> $GITHUB_OUTPUT

      - name: Cache OSM download
        uses: actions/cache@v5
        with:
          path: "data/*.osm.pbf"
          key: cache-osm-${{ steps.get-osm-url.outputs.osm-url }}-${{ steps.calc-year-week.outputs.year-week }}

      - name: Build ways & context
        env:
          LAYERS: ${{ needs.plan.outputs.layers }}
        run: |
          python packs.py ${{ inputs.pack }} --only \
            $(jq -r '.[] | select(. == "ways" or . == "context")' <<< "$LAYERS")

      - name: Upload ways
        if: ${{ contains(fromJSON(needs.plan.outputs.layers), 'ways') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-ways
          path: "data/build/${{ inputs.pack }}.pmtiles/"

      - name: Upload context
        if: ${{ contains(fromJSON(needs.plan.outputs.layers), 'context') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-context
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  metadata:
    name: Write pack.json
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Write pack.json
        run: python packs.py ${{ inputs.pack }} --only metadata

      - name: Upload pack.json
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.pack }}-metadata
          path: "data/build/${{ inputs.pack }}.pmtiles/"

  upload-pack:
    name: Archive and upload pack
    runs-on: ubuntu-24.04
    needs:
      - plan
      - rocks
      - water
      - contours
      - osm
      - metadata
    # Run when the jobs for layers that weren't built were skipped, but not when
    # any job failed or the run was cancelled
    if: ${{ !cancelled() && !failure() }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all PMTiles artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.pack }}-*
          path: data

      - name: Zip up the pack
        env:
          BUILT: ${{ needs.plan.outputs.layers }}
          REUSED: ${{ needs.plan.outputs.reused }}
        run: |
          mkdir -p build/${{ inputs.pack }}
          # Fails if the artifact of a layer that was built is missing
          for layer in $(jq -r '.[]' <<< "$BUILT") metadata; do
            mv ${{ inputs.pack }}-$layer/* build/${{ inputs.pack }}/
          done
          # Take the layers that weren't built from the published pack, with
          # their files like rocks-citations.csv
          if [ "$REUSED" != "[]" ]; then
            curl -sf -o published.zip "$PACK_URL"
            for layer in $(jq -r '.[]' <<< "$REUSED"); do
              unzip -o -d build/ published.zip "${{ inputs.pack }}/$layer.pmtiles"
              # Not every layer has other files, and unzip exits 11 if none match
              unzip -o -d build/ published.zip "${{ inputs.pack }}/$layer-*" \
                || [ $? -eq 11 ]
            done
            rm published.zip
          fi
          cd build/
          zip ${{ inputs.pack }}.pmtiles.zip ${{ inputs.pack }}/*
          cd ../

      - name: Upload pack zip as artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          path: data/build/${{ inputs.pack }}.pmtiles.zip
          # Upload the zip as-is so it doesn't get wrapped in another zip
          archive: false

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the manifest
        if: ${{ inputs.publish }}
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            --user "$(id -u):$(id -g)" -e HOME=/tmp ${{ inputs.image }} \
            python packs.py manifest \
              --s3-bucket-url https://static.underfoot.rocks \
              --manifest-url https://static.underfoot.rocks/manifest.json

      - name: Set up s3cmd for Digital Ocean
        if: ${{ inputs.publish }}
        uses: s3-actions/s3cmd@v1.2.0
        with:
          provider: digitalocean
          region: sfo2
          access_key: ${{ secrets.DO_SPACES_KEY }}
          secret_key: ${{ secrets.DO_SPACES_SECRET }}

      - name: Upload pack to Digital Ocean
        if: ${{ inputs.publish }}
        run: |
          s3cmd put build/manifest.json s3://underfoot2/manifest.json
          s3cmd setacl s3://underfoot2/manifest.json --acl-public
          s3cmd put build/${{ inputs.pack }}.pmtiles.zip s3://underfoot2/${{ inputs.pack }}.pmtiles.zip
          s3cmd setacl s3://underfoot2/${{ inputs.pack }}.pmtiles.zip --acl-public

      - name: Set up doctl
        if: ${{ inputs.publish }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Flush the CDN cache
        if: ${{ inputs.publish }}
        run: doctl compute cdn flush ee6a9baf-c5bd-423d-bbcf-305e3a3f5e40
