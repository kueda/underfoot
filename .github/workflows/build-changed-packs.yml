name: Build changed packs

on:
  push:
    paths:
      - data/packs/*.json
      - data/sources/**
      # Build all packs builds every pack when these change, and data/changed_packs.py
      # ignores util/__init__.py
      - '!data/sources/util/**'
    branches: main

permissions:
  actions: write      # skip-duplicate-actions cancels superseded runs
  contents: read
  packages: write     # build-image.yml pushes to GHCR

jobs:
  skip-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ github.token }}

  list-changed-packs:
    needs: skip-duplicates
    name: List changed packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for the diff against the commit before the push

      # List the packs whose definitions or sources changed with the layers to build,
      # or none if the Build all packs workflow will build them
      - id: set-matrix
        name: Set matrix with IDs and layers of changed packs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          matrix=$(git diff --name-only "$BEFORE" "$AFTER" | python3 data/changed_packs.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  # Don't build the image or run the tests if there are no packs to build
  image:
    needs: list-changed-packs
    if: ${{ needs.list-changed-packs.outputs.matrix != '[]' }}
    uses: ./.github/workflows/build-image.yml

  # Don't spend time and bandwidth building packs if the tests fail
  run-pytest:
    needs: image
    uses: ./.github/workflows/pytest.yml
    with:
      image: ${{ needs.image.outputs.image }}

  build-packs:
    name: Build packs
    needs: [image, list-changed-packs, run-pytest]
    if: ${{ needs.list-changed-packs.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      # Each pack runs several jobs at once, and too many at once get
      # rate limited by servers like Census that we download from
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.list-changed-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      layers: ${{ toJSON(matrix.layers) }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
