name: Build changed packs

on:
  push:
    paths: packs/*.json
    branches: main

permissions:
  actions: write      # skip-duplicate-actions cancels superseded runs
  contents: read
  packages: write     # build-image.yml pushes to GHCR

jobs:
  skip-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ github.token }}

  image:
    needs: skip-duplicates
    uses: ./.github/workflows/build-image.yml

  list-changed-packs:
    needs: skip-duplicates
    name: List changed packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Detect changed pack definitions
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            changed:
              - added|modified: 'packs/*.json'

      # Convert paths into a list of pack IDs
      - id: set-matrix
        if: ${{ steps.filter.outputs.changed == 'true' }}
        name: Set matrix with basenames of changed paths
        # Run basename on the list of changed files then convert the list to
        # JSON
        run: echo "matrix=$(basename -s .json ${{ steps.filter.outputs.changed_files }} | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build-packs:
    name: Build packs
    needs: [image, list-changed-packs]
    if: ${{ needs.list-changed-packs.outputs.matrix }}
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJson(needs.list-changed-packs.outputs.matrix) }}
    uses: ./.github/workflows/build-pack.yml
    with:
      pack: ${{ matrix.pack }}
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
