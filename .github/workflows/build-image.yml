name: Build image

# Builds the app image (Dockerfile) once per commit and pushes it to GHCR, so
# the test and pack-build jobs run inside it instead of reinstalling the whole
# GDAL / imposm / Python toolchain on every run. Layer cache lives in a
# :buildcache tag on the same GHCR repo (needs only packages: write).

on:
  workflow_call:
    outputs:
      image:
        description: The pushed image reference, tagged with the commit SHA
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: Build and push app image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: ref
        name: Compute image refs
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}/app:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/${repo}/app:buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=registry,ref=${{ steps.ref.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.ref.outputs.cache }},mode=max
